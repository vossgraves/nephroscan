services:
  - type: web
    name: nephroscan-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Render injects PORT; the image defaults to 8080 for local runs.
    # Free web services sleep after 15 minutes idle and are not always-on.
    # Keep one instance for the 512 MB / 0.1 CPU free-service limit.
    envVars:
      - key: MODEL_DIR
        value: /app/models
      - key: FRONTEND_DIR
        value: /app/frontend
      - key: RUST_LOG
        value: info
      - key: TOKIO_WORKER_THREADS
        value: "1"
    healthCheckPath: /api/health
    numInstances: 1
    autoDeploy: true
