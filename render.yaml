services:
  - type: web
    name: nephroscan-ai
    runtime: python
    plan: free
    buildCommand: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --timeout 180 app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: MODEL_DIR
        value: models
      - key: CORS_ORIGINS
        sync: false
      - key: API_BASE_URL
        value: /api
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /api/health
    autoDeploy: true
