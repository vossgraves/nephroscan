services:
  nephroscan:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MODEL_DIR=/app/models
      - FRONTEND_DIR=/app/frontend
      - RUST_LOG=info
      - TOKIO_WORKER_THREADS=1
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
